spring:
  datasource:
    url: jdbc:h2:mem:svtest;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # 用 update 而非 create-drop：全部测试 context 共享同一个 mem:svtest 库（DB_CLOSE_DELAY=-1），
      # 而 create-drop 会让每个新建 context 在启动时 drop+create 全表，清空其他 context 已 seed 的数据。
      # 若某 context 的 ContentStore（5s TTL 快照）恰在该窗口内重载，即缓存空内容且 5s 内不再刷新，
      # 使随后的 SimulatePipelineIntegrationTest 读到空场景列表而报「未知场景」（仅在 JVM 被拖慢时暴露）。
      # update 只建表不删表，数据全程驻留，消除该时序窗口；种子逻辑幂等（表空才灌），不会重复插入。
      ddl-auto: update
    properties:
      hibernate.globally_quoted_identifiers: true
  flyway:
    # 测试库走 H2 + ddl-auto；MySQL 方言的 V1/V2 迁移在本地 MySQL 演练（见 Batch 5 spec §3）
    enabled: false

soul:
  llm:
    provider: mock
  asr:
    provider: mock   # M11：转写用 MockAsrClient 的确定性样例，语音路径断言才能逐字钉住
  security:
    jwt:
      # 仅在 test profile 下使用的固定密钥：主配置已去掉默认值（否则生产忘配 = 用公开密钥签发令牌）。
      # 测试不能依赖环境变量，所以这里显式给一个 49 字节的测试专用值。
      secret: test-only-secret-0123456789abcdef0123456789abcdef
    # 大批集成测试会连续注册/刷新（同一 127.0.0.1），限流阈值在测试里放宽；
    # 限流本身的行为由 RateLimitGuardTest 用独立 IP + @TestPropertySource 小阈值验证。
    register-limit:
      per-hour: 1000
      per-day: 5000
    refresh-limit:
      per-minute: 1000

logging:
  level:
    com.leyon.soul: INFO
