spring:
  datasource:
    url: jdbc:h2:mem:svtest;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.globally_quoted_identifiers: true

soulvoyage:
  llm:
    provider: mock
  asr:
    provider: mock   # M11：转写用 MockAsrClient 的确定性样例，语音路径断言才能逐字钉住

logging:
  level:
    com.soulvoyage: INFO
