spring:
  datasource:
    url: jdbc:h2:mem:svtest;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.globally_quoted_identifiers: true

soulvoyage:
  llm:
    provider: mock

logging:
  level:
    com.soulvoyage: INFO
