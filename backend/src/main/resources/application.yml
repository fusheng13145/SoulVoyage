server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: soulvoyage
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    # 本机 MySQL 8.4（后续切换 docker-compose 时仅改此处，见 deploy/docker-compose.yml）
    url: jdbc:mysql://${SV_MYSQL_HOST:127.0.0.1}:${SV_MYSQL_PORT:3306}/soulvoyage?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${SV_MYSQL_USER:soulvoyage}
    password: ${SV_MYSQL_PASS:CHANGE_ME_local_dev}
    hikari:
      maximum-pool-size: 16
  jpa:
    hibernate:
      ddl-auto: none   # 表结构以 deploy/sql/schema.sql 为唯一事实源
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  data:
    redis:
      host: ${SV_REDIS_HOST:127.0.0.1}   # 本机 Redis（D:\Redis）
      port: ${SV_REDIS_PORT:6379}
      password: ${SV_REDIS_PASS:}        # 本机无密码留空；docker-compose 走 requirepass
      timeout: 3s
  threads:
    virtual:
      enabled: true    # Java 21 虚拟线程：LLM 调用为 I/O 密集
  servlet:
    multipart:
      # 上限刻意高于业务侧 5MB：让"录音太大"由业务给出中文话术，而不是容器甩 413
      max-file-size: ${SV_UPLOAD_MAX_FILE:6MB}
      max-request-size: ${SV_UPLOAD_MAX_REQUEST:6MB}
      file-size-threshold: ${SV_UPLOAD_MEM_THRESHOLD:6MB}   # 阈值刻意高于上限：被接受的录音全程留在内存，不产生临时文件

soulvoyage:
  business-zone: ${SV_BUSINESS_ZONE:Asia/Shanghai}   # O1：业务日期归属时区
  distributed: ${SV_DISTRIBUTED:false}               # M13：true=跨节点状态（LLM 闸门/滑动窗/事件流/导出快照）下 Redis
  crisis:                                            # 下篇·S1 危机生命周期
    cooldown: 7d                                     # CRISIS 强干预窗口
    downgrade-threshold: -0.3                        # 冷却自动解除：周画像 avgValence 阈值
    downgrade-weeks: 2                               # 连续 N 个完整自然周达标
  account:
    deletion-cooldown: 7d                            # S2 注销冷静期（期满销毁用户 DEK）
  security:
    jwt:
      secret: ${SV_JWT_SECRET:DEV_ONLY_CHANGE_ME_DEV_ONLY_CHANGE_ME_32B+}   # ≥32字节
      access-ttl: 30m
      refresh-ttl: 7d
    login-lock:                                      # S3 登录失败锁定
      max-fail: 5
      window: 15m
    cors-allowed-origins: ${SV_CORS_ORIGINS:http://localhost:5173}
    master-key: ${SV_MASTER_KEY:}          # Base64 32字节主密钥 MK；为空则启动时生成临时密钥并告警（仅限开发）
  llm:
    provider: ${SV_LLM_PROVIDER:mock}      # mock | openai（DashScope compatible-mode 等）
    base-url: ${SV_LLM_BASE_URL:}
    api-key: ${SV_LLM_API_KEY:}
    model: ${SV_LLM_MODEL:}
    timeout: 60s
    # §九 高并发承诺：LLM 出入口的令牌桶 + 在途并发闸门（0=该层关闭）
    rate-per-minute: ${SV_LLM_RATE_PER_MIN:600}
    max-in-flight: ${SV_LLM_MAX_IN_FLIGHT:32}
    queue-wait: ${SV_LLM_QUEUE_WAIT:1500ms}
  asr:                                        # M11 语音日记：与 llm 同构的供应商抽象（mock | openai）
    provider: ${SV_ASR_PROVIDER:mock}
    base-url: ${SV_ASR_BASE_URL:${SV_LLM_BASE_URL:}}     # 缺省沿用 LLM 那对凭据：同一家供应商通常一起开
    api-key: ${SV_ASR_API_KEY:${SV_LLM_API_KEY:}}
    model: ${SV_ASR_MODEL:whisper-1}
    timeout: 30s
    max-bytes: 5242880                        # 单段录音上限 5MB（约 90 秒 opus）
  neo4j:
    enabled: ${SV_NEO4J_ENABLED:false}     # 本机暂未安装，M2 接入时置 true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
  level:
    com.soulvoyage: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
