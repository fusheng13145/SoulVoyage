# 心屿漫行生产入口：静态前端 + 后端反代（SSE 友好）
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # API：JWT 全走这里；任务流/漫聊是 SSE，必须关缓冲、拉长读超时
  location /api/ {
    proxy_pass http://app:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    client_max_body_size 1m;
  }

  # 容器健康探活/负载均衡用，只回 status 字段
  location = /actuator/health {
    proxy_pass http://app:8080;
    proxy_set_header Host $host;
  }

  # OpenAPI 契约与 swagger-ui 只在开发/内网暴露，生产默认关闭
  location /v3/api-docs { return 404; }
  location /swagger-ui { return 404; }

  # 带哈希的构建产物长期缓存；index.html 永远回源
  location ~* \.(js|css|woff2|png|jpg|svg|webmanifest)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # PWA/注册路由等前端路径统一回 index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
