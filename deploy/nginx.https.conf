# 心屿漫行生产入口（HTTPS）：80 强制跳转，443 终止 TLS，静态前端 + 后端反代
# 用法：docker compose -f docker-compose.yml -f docker-compose.tls.yml --env-file local.env up -d --build

server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;
  server_tokens off;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # 安全头：所有 location 不单独 add_header，避免 nginx 继承失效
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # API：JWT + SSE；必须关缓冲、拉长读超时
  location /api/ {
    proxy_pass http://app:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    client_max_body_size 6m;
  }

  location = /actuator/health {
    proxy_pass http://app:8080;
    proxy_set_header Host $host;
  }

  # OpenAPI/swagger 只在开发/内网暴露
  location /v3/api-docs { return 404; }
  location /swagger-ui { return 404; }

  # 带哈希产物长期缓存；用 expires 生成缓存头，保持安全头继承
  location ~* \.(js|css|woff2|png|jpg|svg|webmanifest)$ {
    expires 30d;
    try_files $uri =404;
  }
  location = /index.html {
    expires -1;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
