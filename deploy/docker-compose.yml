# 心屿漫行 SoulVoyage — 生产编排
# 启动：cd deploy && docker compose --env-file local.env up -d --build
# 密钥一律走 local.env（已 gitignore）；前端先 npm run build，dist 由 web 只读挂载
name: soulvoyage

services:
  mysql:
    image: mysql:8.4
    ports: ["127.0.0.1:3306:3306"]   # 仅本机调试用，外部流量一律走 web:80
    environment:
      MYSQL_ROOT_PASSWORD: ${SV_MYSQL_ROOT_PASS:?}
      MYSQL_DATABASE: soulvoyage
      MYSQL_USER: soulvoyage
      MYSQL_PASSWORD: ${SV_MYSQL_PASS:?}
      TZ: Asia/Shanghai               # 业务日期/周统计以东八区为准
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro   # schema.sql 首次自动导入
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${SV_MYSQL_ROOT_PASS:?}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${SV_REDIS_PASS:?}
    ports: ["127.0.0.1:6379:6379"]
    volumes:
      - ./redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SV_REDIS_PASS:?}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  # Neo4j 暂不编排：应用侧尚无 driver，KG 真源是 MySQL kg_node 表（手册 §5.3）。
  # 待 KG 接入 Neo4j 时再补回该服务与 SV_NEO4J_* 环境变量。

  app:
    build: ../backend
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    environment:
      SV_MYSQL_HOST: mysql
      SV_MYSQL_PASS: ${SV_MYSQL_PASS:?}
      SV_REDIS_HOST: redis
      SV_REDIS_PASS: ${SV_REDIS_PASS:?}
      SV_MASTER_KEY: ${SV_MASTER_KEY:?}
      SV_JWT_SECRET: ${SV_JWT_SECRET:?}
      SV_LLM_PROVIDER: ${SV_LLM_PROVIDER:?}   # 生产必须显式选 provider，禁默认 mock
      SV_LLM_API_KEY: ${SV_LLM_API_KEY:?}
      SV_CORS_ORIGINS: ${SV_CORS_ORIGINS:?}
      SV_DISTRIBUTED: ${SV_DISTRIBUTED:-true}   # M13：多副本部署时限流/事件流/导出快照跨节点共享
      TZ: Asia/Shanghai

  web:
    image: nginx:alpine
    ports: ["80:80"]
    depends_on:
      app: { condition: service_healthy }
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
